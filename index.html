<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF--8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlQuran360</title>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "firebase/": "https://aistudiocdn.com/firebase@^12.4.0/"
  }
}
</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap');

    :root {
      --font-sans: 'Poppins', sans-serif;
      --font-amiri: 'Amiri', serif;
    }

    body {
        font-family: var(--font-sans);
        transition: background-color 0.5s ease, color 0.5s ease;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .font-amiri {
        font-family: var(--font-amiri);
    }

    /* Keyframes for animations */
    @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fade-in 0.3s ease-out; }
    .animate-fade-in-up { animation: fade-in-up 0.3s ease-out; }

    @keyframes plus-one {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-30px) scale(1.5); opacity: 0; }
    }
    .animate-plus-one {
        animation: plus-one 0.5s ease-out forwards;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
    }

    .scrollbar-hide::-webkit-scrollbar {
        display: none;
    }
    .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }


    /* Light Theme (Default) */
    .light {
        --color-primary: #121212; /* Main Text */
        --color-secondary: #6b7280; /* Secondary Text, backgrounds */
        --color-tertiary: #f3f4f6; /* Tertiary backgrounds */
        --color-accent: #10B981; /* Accent color */
        --color-accent-text: #10B981;
        --color-inverted: #FFFFFF; /* Text on accent bg */
        --bg-primary: #FFFFFF;
        --bg-secondary: #f9fafb;
        --bg-tertiary: #f3f4f6;
        --border-primary: #e5e7eb;
        --placeholder-color: #9ca3af;
    }
    
    /* Dim Theme */
    .dim {
        --color-primary: #e5e7eb;
        --color-secondary: #9ca3af;
        --color-tertiary: #4b5563;
        --color-accent: #10B981;
        --color-accent-text: #10B981;
        --color-inverted: #FFFFFF;
        --bg-primary: #1f2937;
        --bg-secondary: #374151;
        --bg-tertiary: #4b5563;
        --border-primary: #374151;
        --placeholder-color: #6b7280;
    }

    /* Lights Out Theme */
    .lightsOut {
        --color-primary: #f9fafb;
        --color-secondary: #9ca3af;
        --color-tertiary: #1f2937;
        --color-accent: #10B981;
        --color-accent-text: #10B981;
        --color-inverted: #FFFFFF;
        --bg-primary: #000000;
        --bg-secondary: #111827;
        --bg-tertiary: #1f2937;
        --border-primary: #374151;
        --placeholder-color: #6b7280;
    }

    /* Dark Grey Theme */
    .darkGrey {
        --color-primary: #e0e0e0;
        --color-secondary: #a0a0a0;
        --color-tertiary: #2a2a2a;
        --color-accent: #10B981;
        --color-accent-text: #10B981;
        --color-inverted: #FFFFFF;
        --bg-primary: #121212;
        --bg-secondary: #1e1e1e;
        --bg-tertiary: #2a2a2a;
        --border-primary: #333333;
        --placeholder-color: #6b7280;
    }

    /* Utility Classes */
    body {
        background-color: var(--bg-primary);
        color: var(--color-primary);
    }
    .bg-primary { background-color: var(--bg-primary); }
    .bg-secondary { background-color: var(--bg-secondary); }
    .bg-tertiary { background-color: var(--bg-tertiary); }
    .accent-bg { background-color: var(--color-accent); }
    .text-primary { color: var(--color-primary); }
    .text-secondary { color: var(--color-secondary); }
    .accent-text { color: var(--color-accent-text); }
    .text-inverted { color: var(--color-inverted); }
    .border-primary { border-color: var(--border-primary); }
    .accent-border { border-color: var(--color-accent); }
    .placeholder-color::placeholder { color: var(--placeholder-color); }

  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
