<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF--8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlQuran360</title>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.27.0"
  }
}
</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap');

    :root {
      --font-sans: 'Poppins', sans-serif;
      --font-amiri: 'Amiri', serif;
    }

    html {
      background-color: var(--bg-primary);
      overscroll-behavior-y: contain;
    }

    body {
        font-family: var(--font-sans);
        transition: background-color 0.5s ease, color 0.5s ease;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-touch-callout: none; /* iOS Safari */
        -webkit-user-select: none;   /* Safari */
        -khtml-user-select: none;    /* Konqueror HTML */
        -moz-user-select: none;      /* Old versions of Firefox */
        -ms-user-select: none;       /* Internet Explorer/Edge */
        user-select: none;           /* Non-prefixed version, currently supported by Chrome, Edge, Opera and Firefox */
        overscroll-behavior-y: contain; /* Disable pull-to-refresh */
    }
    
    .allow-selection {
      -webkit-touch-callout: default; /* iOS Safari */
      -webkit-user-select: text;   /* Safari */
      -khtml-user-select: text;    /* Konqueror HTML */
      -moz-user-select: text;      /* Old versions of Firefox */
      -ms-user-select: text;       /* Internet Explorer/Edge */
      user-select: text;           /* Non-prefixed version, currently supported by Chrome, Edge, Opera and Firefox */
    }
    .allow-selection * {
      -webkit-user-select: inherit;
      -moz-user-select: inherit;
      -ms-user-select: inherit;
      user-select: inherit;
    }

    .font-amiri {
        font-family: var(--font-amiri);
    }

    /* Keyframes for animations */
    @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fade-in 0.3s ease-out; }
    .animate-fade-in-up { animation: fade-in-up 0.3s ease-out; }

    @keyframes pop-in {
        0% { transform: scale(0.5); opacity: 0.5; }
        60% { transform: scale(1.2); opacity: 1; }
        100% { transform: scale(1); }
    }
    .animate-pop-in {
        animation: pop-in 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    /* For Tasbeeh Dhikr Card */
    @keyframes slide-in-right {
        from { transform: translateX(-100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }
    @keyframes slide-in-left {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }
    .animate-slide-in-right { animation: slide-in-right 0.3s ease-out forwards; }
    .animate-slide-in-left { animation: slide-in-left 0.3s ease-out forwards; }

    @keyframes plus-one-pop {
        0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
        100% { transform: translate(-50%, -150%) scale(1.2); opacity: 0; }
    }
    .animate-plus-one-pop {
        animation: plus-one-pop 0.6s ease-out forwards;
    }

    .scrollbar-hide::-webkit-scrollbar {
        display: none;
    }
    .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
    
    /* AI Button Animations */
    @keyframes ai-glow {
        0%, 100% { box-shadow: 0 0 10px rgba(16, 185, 129, 0.4), 0 0 20px rgba(16, 185, 129, 0.2), inset 0 0 5px rgba(255, 255, 255, 0.1); }
        50% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.7), 0 0 30px rgba(16, 185, 129, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.2); }
    }
    @keyframes ai-gradient-shift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    .ai-button-animated {
        background-size: 200% 200% !important;
        animation: ai-gradient-shift 8s ease infinite, ai-glow 4s ease-in-out infinite;
    }
    
    /* New AI Icon Animation */
    @keyframes ai-orbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    .ai-orbit-container {
        transform-origin: center;
        animation: ai-orbit 5s linear infinite;
    }
    
    /* Autoscroll animation for long text */
    @keyframes autoscroll-x {
      0% { transform: translateX(0); }
      10% { transform: translateX(0); } /* Initial pause */
      45% { transform: translateX(var(--scroll-amount, 0px)); } /* Scroll to end */
      55% { transform: translateX(var(--scroll-amount, 0px)); } /* Pause at end */
      90% { transform: translateX(0); } /* Scroll back to start */
      100% { transform: translateX(0); }
    }

    .autoscroll-on-overflow {
        will-change: transform;
        animation: autoscroll-x var(--scroll-duration, 10s) ease-in-out infinite;
    }

    /* AI Button Tooltip Animation */
    @keyframes tooltip-fade-in-out {
      0% { opacity: 0; transform: scale(0.9); }
      10% { opacity: 1; transform: scale(1); }
      90% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.9); }
    }
    .animate-tooltip {
      animation: tooltip-fade-in-out 6s ease-in-out forwards;
    }

    /* AI Ayah Highlight */
    @keyframes highlight-fade {
      0% { background-color: rgba(250, 204, 21, 0.6); } /* yellow-400/60 */
      100% { background-color: transparent; }
    }
    .highlight-ai-pulse {
        animation: highlight-fade 3s ease-out forwards;
    }

    /* Audio Player Progress Bar */
    input[type=range].audio-progress::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: #FFFFFF;
        cursor: pointer;
        margin-top: -6px; /* You need to specify a margin in Chrome, but in Firefox and IE it is automatic */
        box-shadow: 0 0 5px rgba(0,0,0,0.5);
    }

    input[type=range].audio-progress::-moz-range-thumb {
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: #FFFFFF;
        cursor: pointer;
        border: none;
        box-shadow: 0 0 5px rgba(0,0,0,0.5);
    }
    
    /* Ruku Separator */
    .ruku-separator {
        display: flex;
        align-items: center;
        text-align: center;
        color: var(--color-secondary);
        margin: 2rem 0;
    }

    .ruku-separator::before,
    .ruku-separator::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid var(--border-primary);
    }

    .ruku-separator:not(:empty)::before {
        margin-right: .5em;
    }

    .ruku-separator:not(:empty)::after {
        margin-left: .5em;
    }


    /* Light Theme (Default) */
    .light {
        --color-primary: #121212; /* Main Text */
        --color-secondary: #6b7280; /* Secondary Text, backgrounds */
        --color-tertiary: #f3f4f6; /* Tertiary backgrounds */
        --color-accent: #10B981; /* Accent color */
        --color-accent-text: #10B981;
        --color-inverted: #FFFFFF; /* Text on accent bg */
        --bg-primary: #FFFFFF;
        --bg-secondary: #f9fafb;
        --bg-tertiary: #f3f4f6;
        --border-primary: #e5e7eb;
        --placeholder-color: #9ca3af;
    }
    
    /* Dim Theme */
    .dim {
        --color-primary: #e5e7eb;
        --color-secondary: #9ca3af;
        --color-tertiary: #4b5563;
        --color-accent: #10B981;
        --color-accent-text: #10B981;
        --color-inverted: #FFFFFF;
        --bg-primary: #1f2937;
        --bg-secondary: #374151;
        --bg-tertiary: #4b5563;
        --border-primary: #374151;
        --placeholder-color: #6b7280;
    }

    /* Lights Out Theme */
    .lightsOut {
        --color-primary: #f9fafb;
        --color-secondary: #9ca3af;
        --color-tertiary: #1f2937;
        --color-accent: #10B981;
        --color-accent-text: #10B981;
        --color-inverted: #FFFFFF;
        --bg-primary: #000000;
        --bg-secondary: #111827;
        --bg-tertiary: #1f2937;
        --border-primary: #374151;
        --placeholder-color: #6b7280;
    }

    /* Dark Grey Theme */
    .darkGrey {
        --color-primary: #e0e0e0;
        --color-secondary: #a0a0a0;
        --color-tertiary: #2a2a2a;
        --color-accent: #10B981;
        --color-accent-text: #10B981;
        --color-inverted: #FFFFFF;
        --bg-primary: #121212;
        --bg-secondary: #1e1e1e;
        --bg-tertiary: #2a2a2a;
        --border-primary: #333333;
        --placeholder-color: #6b7280;
    }

    /* Utility Classes */
    body {
        background-color: var(--bg-primary);
        color: var(--color-primary);
    }
    .bg-primary { background-color: var(--bg-primary); }
    .bg-secondary { background-color: var(--bg-secondary); }
    .bg-tertiary { background-color: var(--bg-tertiary); }
    .accent-bg { background-color: var(--color-accent); }
    .text-primary { color: var(--color-primary); }
    .text-secondary { color: var(--color-secondary); }
    .accent-text { color: var(--color-accent-text); }
    .text-inverted { color: var(--color-inverted); }
    .border-primary { border-color: var(--border-primary); }
    .accent-border { border-color: var(--color-accent); }
    .placeholder-color::placeholder { color: var(--placeholder-color); }

  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
