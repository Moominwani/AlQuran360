<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlQuran360</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        overscroll-behavior-y: none;
      }
      @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap');
      .font-amiri {
        font-family: 'Amiri', serif;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fadeIn 0.2s ease-out forwards;
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up {
        animation: fadeInUp 0.2s ease-out forwards;
      }

      /* THEME STYLES */
      /* Light Theme (default) */
      body { background-color: #ffffff; color: #1f2937; }
      .bg-primary { background-color: #ffffff; }
      .bg-secondary { background-color: #f3f4f6; }
      .bg-tertiary { background-color: #d1fae5; }
      .bg-quaternary { background-color: #e5e7eb; }
      .text-primary { color: #1f2937; }
      .text-secondary { color: #6b7280; }
      .text-inverted { color: #ffffff; }
      .placeholder-color::placeholder { color: #6b7280; }
      .border-primary { border-color: #e5e7eb; }
      .border-secondary { border-color: #4b5563; }
      .accent-text { color: #eec35a; }
      .accent-bg { background-color: #facc15; }
      .accent-border { border-color: #facc15; }

      /* Dim Theme */
      .dim body { background-color: #0d2821; color: #e5e7eb; }
      .dim .bg-primary { background-color: #0d2821; }
      .dim .bg-secondary { background-color: #113129; }
      .dim .bg-tertiary { background-color: #1a4538; }
      .dim .bg-quaternary { background-color: #374151; }
      .dim .text-primary { color: #e5e7eb; }
      .dim .text-secondary { color: #9ca3af; }
      .dim .text-inverted { color: #0d2821; }
      .dim .placeholder-color::placeholder { color: #9ca3af; }
      .dim .border-primary { border-color: #374151; }
      .dim .border-secondary { border-color: #4b5563; }

      /* Lights Out Theme */
      .lightsOut body { background-color: #000000; color: #e5e7eb; }
      .lightsOut .bg-primary { background-color: #000000; }
      .lightsOut .bg-secondary { background-color: #111827; }
      .lightsOut .bg-tertiary { background-color: #1f2937; }
      .lightsOut .bg-quaternary { background-color: #374151; }
      .lightsOut .text-primary { color: #e5e7eb; }
      .lightsOut .text-secondary { color: #9ca3af; }
      .lightsOut .text-inverted { color: #000000; }
      .lightsOut .placeholder-color::placeholder { color: #6b7280; }
      .lightsOut .border-primary { border-color: #374151; }
      .lightsOut .border-secondary { border-color: #4b5563; }
    </style>

  }
}
</script>
</head>

</html>
